<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLM MOTION GRAPHIC — EASING</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Serif:ital@1&display=swap">
<link rel="stylesheet" href="./styles.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.15.0/index.js",
    "gsap/CustomEase": "https://cdn.jsdelivr.net/npm/gsap@3.15.0/CustomEase.js"
  }
}
</script>
</head>
<body data-theme="light">

<div class="corners" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

<header class="meta">
  <p class="mark"><b>LLM MOTION GRAPHIC</b><span>말 → GSAP 이즈 → three.js 룩</span></p>

  <nav class="picks">
    <div class="seg" role="group" aria-label="그래프">
      <button type="button" data-mode="speed" title="속도 그래프 — 얼마나 빨리 움직이나">SPEED</button>
      <button type="button" data-mode="value" class="on" title="값 그래프 — 어디에 있나">VALUE</button>
    </div>

    <div class="seg" role="group" aria-label="룩">
      <button type="button" data-look="clean" title="1 — 보정도 블러도 없음">CLEAN</button>
      <button type="button" data-look="glow" title="2 — 블룸과 깊은 어둠">GLOW</button>
      <button type="button" data-look="film" title="3 — 들뜬 검정과 입자, 긴 셔터">FILM</button>
      <button type="button" data-look="paper" class="on" title="4 — 밝은 종이 위의 평평한 원">PAPER</button>
    </div>
  </nav>
</header>

<section class="title">
  <h1 id="headline">Twelve ways to get from A to B.</h1>
  <p class="subline">SAME DISTANCE · SAME DURATION (<span id="durationEcho">0.40s</span>)</p>
</section>

<main>
  <div id="stage" class="stage" aria-label="움직임마다 값 그래프와, 그 이즈로 A에서 B까지 가는 공"></div>
</main>

<footer class="transport">
  <div class="group">
    <span class="clock" id="clock">00:00:00:00</span>
    <span class="t" id="t">t 0.00</span>
    <button id="play" type="button" class="on" title="SPACE">PAUSE</button>
  </div>

  <div class="group">
    <div class="seg" role="group" aria-label="보조선">
      <button type="button" data-toggle="ticks" title="같은 시간마다 공이 있던 자리">SPACING</button>
      <button type="button" data-toggle="ghosts" title="지나온 자리의 잔상">TRAIL</button>
      <button type="button" data-toggle="squash" title="빠를수록 늘어난다">SQUASH</button>
    </div>

    <label class="dial">
      <span>DURATION <b id="durationOut">0.40s</b></span>
      <input id="duration" type="range" min="40" max="400" value="40" aria-label="한 번 가는 데 걸리는 시간">
    </label>
  </div>

  <div class="progress" id="progress" title="끌면 시간을 손으로 움직입니다"><i></i></div>
</footer>

<noscript><p class="noscript">이 페이지는 WebGL과 자바스크립트로 그립니다.</p></noscript>

<script type="module" src="./src/main.js"></script>
</body>
</html>
